name: Build & Deploy iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:   # también se puede correr manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-14   # GitHub provee Mac con Xcode incluido — gratis en repo público

    steps:
      # 1. Bajar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Ruby + Fastlane (automatiza firma y build)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      # 3. Importar certificados desde GitHub Secrets
      #    (los subes UNA vez en Settings > Secrets)
      - name: Import Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temp_keychain_pass
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # 4. Instalar perfil de provisioning
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # 5. Build del .ipa
      - name: Build IPA
        run: |
          xcodebuild -scheme "${{ vars.XCODE_SCHEME }}" \
            -configuration Release \
            -archivePath ./build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ vars.PROVISIONING_PROFILE_NAME }}"

          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build/output

      # 6. Subir el .ipa como artifact (descargable desde GitHub)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ github.sha }}
          path: ./build/output/*.ipa
          retention-days: 30

      # 7. (Opcional) Subir a TestFlight automáticamente
      # - name: Upload to TestFlight
      #   env:
      #     APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
      #   run: fastlane pilot upload --ipa ./build/output/App.ipa
